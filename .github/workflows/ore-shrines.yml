name: Ore Shrines

on:
  push:
    paths:
      - 'ore-shrines/**'
      - '.github/workflows/ore-shrines.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ore-shrines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain > build.log 2>&1 || status=$?
          grep -E -A2 'error:|What went wrong' build.log | head -60 || true
          exit ${status:-0}
      # Mixins only fail at runtime, so check the injected method still exists with the expected arguments.
      - name: Mixin target check
        shell: bash
        run: |
          JAR=$(find ~/.gradle -name 'minecraft-merged*.jar' | head -1)
          javap -p -cp "$JAR" net.minecraft.world.level.NaturalSpawner | grep -F 'private static boolean isValidSpawnPostitionForType(net.minecraft.server.level.ServerLevel, net.minecraft.world.entity.MobCategory, net.minecraft.world.level.StructureManager, net.minecraft.world.level.chunk.ChunkGenerator, net.minecraft.world.level.biome.MobSpawnSettings$SpawnerData, net.minecraft.core.BlockPos$MutableBlockPos, double);'
      - uses: actions/upload-artifact@v4
        with:
          name: ore-shrines
          path: ore-shrines/build/libs/ore-shrines-*.jar
