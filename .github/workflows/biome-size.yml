name: Biome Size

on:
  push:
    paths:
      - 'biome-size/**'
      - '.github/workflows/biome-size.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: biome-size
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain > build.log 2>&1 || status=$?
          grep -E -A2 'error:|What went wrong' build.log | head -60 || true
          exit ${status:-0}
      # The Noises mixin only shows up at runtime, so boot one dedicated server with only this mod and a
      # world that already has a biomesize.json (50% biomes, 150% terrain, 150% dramatic, 200% mountains, 150% caves, 200% water, 0% lava).
      - name: Server smoke test
        shell: bash
        run: |
          mkdir -p run/world
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:normal\n' > run/server.properties
          echo '{"biome_size":50,"terrain_scale":150,"dramatic_terrain":150,"mountains":200,"cave_size":150,"underground_water":200,"underground_lava":0}' > run/world/biomesize.json
          mkfifo stdin.pipe
          (./gradlew runServer --console=plain < stdin.pipe > server.log 2>&1; echo "exit $?" >> server.log) &
          exec 3>stdin.pipe
          for i in $(seq 1 60); do
            if grep -q 'Done (' server.log || grep -q '^exit ' server.log; then break; fi
            sleep 5
          done
          echo stop >&3 || true
          sleep 20
          exec 3>&-
          grep -iE 'biome size|biomesize|mixin|error|exception|Done \(' server.log | head -50
          grep -q 'Done (' server.log
          grep -q 'Biome Size: biome size 50%, terrain scale 150%, dramatic terrain 150%, mountains 200%, cave size 150%, water 200%, lava 0%' server.log
          if grep -iE 'mixin.*(fail|error)|InvalidInjection|critical injection' server.log; then exit 1; fi
      - name: Client mixin target check
        shell: bash
        run: |
          JAR=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          javap -p -cp "$JAR" 'net.minecraft.client.gui.screens.worldselection.CreateWorldScreen' | grep -E 'createNewWorldDirectory'
          javap -p -cp "$JAR" 'net.minecraft.client.gui.screens.worldselection.CreateWorldScreen$WorldTab' | grep -E 'WorldTab\('
          javap -p -cp "$JAR" 'net.minecraft.client.gui.components.tabs.GridLayoutTab' | grep -E 'GridLayout layout'
      - uses: actions/upload-artifact@v4
        with:
          name: biome-size
          path: biome-size/build/libs/biome-size-*.jar
