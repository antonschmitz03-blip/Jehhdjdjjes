name: Biome Size research
on:
  push:
    branches: [claude/project-thread-fo0ef3]
    paths: ['.github/workflows/biome-size-research.yml']
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: cd biome-size && chmod +x gradlew && ./gradlew compileJava -q || true
      - shell: bash {0}
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          unzip -l "$MC" | awk '{print $4}' > files.txt
          grep -iE 'AbstractSliderButton|GridLayoutTab|layouts/GridLayout|LayoutSettings|storage/LevelResource|LevelStorageSource' files.txt | head -20
          curl -sSLo vf.jar https://github.com/Vineflower/vineflower/releases/download/1.11.1/vineflower-1.11.1.jar
          mkdir cls out; cd cls
          unzip -q "$MC" $(grep -E '/(RandomState|DensityFunctions|DensityFunction|AbstractSliderButton|GridLayoutTab|GridLayout|LevelResource|NoiseGeneratorSettings)(\$[A-Za-z0-9]+)*\.class$' ../files.txt | tr '\n' ' ')
          cd ..
          java -jar vf.jar -log=ERROR cls out >/dev/null 2>&1
          sec() { awk "/##### .*\\/$1.java/{p=1;next} /^##### /{p=0} p" dump.txt; }
          for f in $(find out -name '*.java' | sort); do echo "##### $f"; grep -v '^import' "$f"; done > dump.txt
          for n in RandomState DensityFunction AbstractSliderButton GridLayoutTab LevelResource; do echo "##### $n"; sec $n | head -400; done
          echo "##### GridLayout"; sec GridLayout | grep -nE 'public ' | head -40
          echo "##### NoiseGeneratorSettings record"; sec NoiseGeneratorSettings | grep -nE 'record NoiseGeneratorSettings|^   [a-zA-Z<>, ]+ [a-zA-Z]+,?$' | head -30; sec NoiseGeneratorSettings | sed -n '1,40p'
          echo "##### DensityFunctions"; sec DensityFunctions | grep -nE 'record (Noise|ShiftedNoise|Constant|Mul|Ap2|HolderHolder|Marker|ShiftA|Shift)\b|public static DensityFunction (mul|constant|add|shiftA|shiftB)\(' | head -40
          sec DensityFunctions | awk '/record NoiseFunction/{p=1} p{print; if (++c>90) exit}'
          sec DensityFunctions | awk '/record HolderHolder/{p=1} p{print; if (++c>40) exit}'
          echo "##### ChunkMap RandomState"; javap -p -cp "$MC" net.minecraft.server.level.ChunkMap | grep -iE 'randomState|ChunkMap\(' 
          unzip -q -o "$MC" 'net/minecraft/server/level/ChunkMap.class' -d cm && java -jar vf.jar -log=ERROR cm cmo >/dev/null 2>&1; grep -n -B3 -A3 'RandomState.create' $(find cmo -name 'ChunkMap.java')
          echo "##### LevelStorageAccess"; javap -p -cp "$MC" 'net.minecraft.world.level.storage.LevelStorageSource$LevelStorageAccess' | grep -iE 'getLevelPath|getLevelId|LevelResource'
          echo "##### MinecraftServer"; javap -p -cp "$MC" net.minecraft.server.MinecraftServer | grep -iE 'getWorldPath|LevelResource'
          echo "##### Tooltip"; javap -p -cp "$MC" net.minecraft.client.gui.components.Tooltip | grep -i create
          echo "##### Screens fabric"; find ~/.gradle -name 'fabric-lifecycle-events*.jar' | head -2
