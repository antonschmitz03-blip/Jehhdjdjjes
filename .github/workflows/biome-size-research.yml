name: Biome Size research
on:
  push:
    branches: [claude/project-thread-fo0ef3]
    paths: ['.github/workflows/biome-size-research.yml']
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: cd biome-size && chmod +x gradlew && ./gradlew compileJava -q || true
      - shell: bash {0}
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          curl -sSLo vf.jar https://github.com/Vineflower/vineflower/releases/download/1.11.1/vineflower-1.11.1.jar
          mkdir cls out; cd cls
          unzip -q "$MC" 'net/minecraft/world/level/levelgen/densityfunction/generator/NoiseFunction*.class' 'net/minecraft/world/level/levelgen/synth/Noise.class' 'net/minecraft/world/level/levelgen/densityfunction/generator/ShiftNoiseFunction*.class'
          cd ..
          java -jar vf.jar -log=ERROR cls out >/dev/null 2>&1
          for f in $(find out -name '*.java' | sort); do echo "##### $f"; grep -v '^import' "$f"; done
          echo "##### KeyEvent"; javap -cp "$MC" net.minecraft.client.input.KeyEvent | grep -iE 'isLeft|isRight|isSelection'
          echo "##### Noises.instantiate callers"; javap -c -p -cp "$MC" net.minecraft.world.level.levelgen.RandomState | grep -n 'Noises.instantiate'
