name: Biome Size research
on:
  push:
    branches: [claude/project-thread-fo0ef3]
    paths: ['.github/workflows/biome-size-research.yml']
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: cd biome-size && chmod +x gradlew && ./gradlew compileJava -q || true
      - shell: bash {0}
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          unzip -l "$MC" | awk '{print $4}' > files.txt
          grep -iE 'Spring' files.txt | head
          curl -sSLo vf.jar https://github.com/Vineflower/vineflower/releases/download/1.11.1/vineflower-1.11.1.jar
          mkdir cls out; cd cls
          unzip -q "$MC" 'net/minecraft/world/level/levelgen/placement/PlacedFeature*.class' 'net/minecraft/world/level/levelgen/feature/SpringFeature*.class' 'net/minecraft/world/level/levelgen/feature/configurations/SpringConfiguration*.class' 'net/minecraft/world/level/levelgen/feature/FeaturePlaceContext*.class' 'net/minecraft/world/level/levelgen/feature/ConfiguredFeature*.class'
          cd ..
          java -jar vf.jar -log=ERROR cls out >/dev/null 2>&1
          for f in $(find out -name '*.java' | sort); do echo "##### $f"; grep -v '^import' "$f"; done
          echo "##### Feature.SPRING"; javap -p -cp "$MC" net.minecraft.world.level.levelgen.feature.Feature | grep -iE 'SPRING|place'
          echo "##### callers of PlacedFeature.place"
          for c in net.minecraft.world.level.chunk.ChunkGenerator; do javap -p -c -cp "$MC" $c | grep -E 'PlacedFeature\.(place|placeWithBiomeCheck|placeWithContext)' | head; done
