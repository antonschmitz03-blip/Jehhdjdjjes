name: Research
on:
  push:
    branches: [claude/project-thread-h6kkmi]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava -q
      - shell: bash {0}
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          unzip -l "$MC" | awk '{print $4}' > files.txt
          j() { for f in "$@"; do echo "##### $f"; unzip -p "$MC" "data/minecraft/$f" | jq -c 'del(.features)'; done; }
          for b in crimson_forest warped_forest basalt_deltas soul_sand_valley deep_dark dripstone_caves lush_caves; do j worldgen/biome/$b.json; done
          j dimension_type/the_nether.json dimension_type/overworld.json
          echo "##### attribute classes"; grep -iE 'attribute' files.txt | grep -v '\$' | head -60
          EA=$(grep -E 'EnvironmentAttributes\.class$' files.txt | head -1); echo "EA=$EA"
          curl -sSLo vf.jar https://github.com/Vineflower/vineflower/releases/download/1.11.1/vineflower-1.11.1.jar
          mkdir cls out
          cd cls && unzip -q "$MC" "$EA" $(grep -E 'AmbientParticleSettings|AmbientAdditionsSettings|AmbientMoodSettings|AmbientSounds' ../files.txt | grep '\.class$' | tr '\n' ' '); cd ..
          java -jar vf.jar -log=ERROR cls out >/dev/null 2>&1
          for f in $(find out -name '*.java' | sort); do echo "##### $f"; grep -v '^import' "$f"; done
          echo "##### sound fields"; javap -cp "$MC" net.minecraft.sounds.SoundEvents | grep -oE ' [A-Z_]+;' | grep -iE 'AMBIENT|DRIP|CHIME|AMETHYST|CAVE|SPORE|MOSS|AZALEA' | tr '\n' ' '
          echo; echo "##### particle fields"; javap -cp "$MC" net.minecraft.core.particles.ParticleTypes | grep -oE ' [A-Z_]+;' | tr '\n' ' '
