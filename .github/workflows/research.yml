name: Research (temporary)

on:
  push:
    branches: [claude/project-thread-pvfpbq]

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :vanilla-tweaks:compileJava --stacktrace -q || true
      - name: Dump classes
        run: |
          MC=$(find ~/.gradle/caches .gradle vanilla-tweaks/.gradle -name 'minecraft-*merged*.jar' -o -name 'minecraft-clientOnly*.jar' -o -name 'minecraft-common*.jar' 2>/dev/null | grep -v sources | tr '\n' ':')
          echo "MC jars: $MC"
          find ~/.gradle/caches .gradle vanilla-tweaks/.gradle -name '*.jar' 2>/dev/null | grep -iE 'minecraft|loom' | grep -v sources | head -40
          FAPI=$(find ~/.gradle/caches -name 'fabric-*.jar' 2>/dev/null | grep -v sources | tr '\n' ':')
          CP="$MC$FAPI"
          for c in \
            net.minecraft.client.renderer.item.ItemModelResolver \
            net.minecraft.client.renderer.item.ItemStackRenderState \
            net.minecraft.client.renderer.entity.EntityRendererProvider\$Context \
            net.fabricmc.fabric.api.client.rendering.v1.LivingEntityRenderLayerRegistrationCallback\$RegistrationHelper \
            net.minecraft.client.model.animal.ghast.HappyGhastModel \
            net.minecraft.client.renderer.entity.state.EntityRenderState \
            net.minecraft.client.renderer.entity.layers.CrossedArmsItemLayer \
            net.minecraft.client.renderer.entity.state.HoldingEntityRenderState \
            net.minecraft.world.item.ItemDisplayContext \
            ; do
            echo "=================== $c"
            javap -p -cp "$CP" "$c" 2>&1 | head -80
          done
          echo "=================== EntityType fields"
          javap -p -cp "$CP" net.minecraft.world.entity.EntityType 2>&1 | grep -i ghast
          echo "=================== HappyGhastRenderer bytecode"
          javap -c -p -cp "$CP" net.minecraft.client.renderer.entity.HappyGhastRenderer 2>&1 | head -260
          echo "=================== CrossedArmsItemLayer bytecode"
          javap -c -p -cp "$CP" net.minecraft.client.renderer.entity.layers.CrossedArmsItemLayer 2>&1 | head -120
          echo "=================== HappyGhastModel bytecode"
          javap -c -p -cp "$CP" net.minecraft.client.model.animal.ghast.HappyGhastModel 2>&1 | head -200
          echo "=================== search classes"
          for j in $(echo "$CP" | tr ':' ' '); do unzip -l "$j" 2>/dev/null | grep -iE 'HappyGhast|RenderStateDataKey|FeatureRendererRegistration|RenderLayerRegistration|EntityRenderStateExtract|Carried.*Layer|SnowGolemHead' | awk '{print $4}'; done | sort -u | head -60
