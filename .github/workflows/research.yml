name: Research
on:
  push:
    branches: [claude/project-thread-h6kkmi]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava -q
      - shell: bash {0}
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          echo "MC=$MC"
          d() { echo "##### $1"; unzip -p "$MC" "data/minecraft/$1"; echo; }
          d dimension_type/overworld.json
          d dimension_type/the_nether.json
          d dimension_type/overworld_caves.json
          d worldgen/noise_settings/caves.json
          d worldgen/noise_settings/overworld.json
          d worldgen/world_preset/normal.json
          d worldgen/biome/dripstone_caves.json
          d worldgen/configured_feature/ore_diamond.json
          d worldgen/configured_feature/ore_iron.json
          d worldgen/placed_feature/ore_diamond.json
          d worldgen/placed_feature/ore_diamond_large.json
          d worldgen/placed_feature/ore_iron_upper.json
          d worldgen/placed_feature/ore_iron_middle.json
          d worldgen/placed_feature/ore_coal_upper.json
          d worldgen/placed_feature/ore_redstone.json
          d worldgen/placed_feature/ore_lapis.json
          d worldgen/placed_feature/ore_copper.json
          echo "##### ore files"; unzip -l "$MC" | grep -E 'worldgen/(placed|configured)_feature/ore_' | awk '{print $4}'
          echo "##### density functions"; unzip -l "$MC" | grep -E 'worldgen/density_function/' | awk '{print $4}'
          echo "##### dimension dirs"; unzip -l "$MC" | grep -E 'data/minecraft/(dimension|dimension_type)/' | awk '{print $4}'
          echo "##### tags"; unzip -l "$MC" | grep -E 'tags/(block|worldgen/biome)/' | awk '{print $4}' | grep -iE 'portal|infiniburn|base_stone|overworld_carver|is_overworld|deepslate_ore|stone_ore' 
          for f in $(unzip -l "$MC" | awk '{print $4}' | grep -E 'tags/block/infiniburn_overworld.json|tags/block/base_stone_overworld.json'); do echo "##### $f"; unzip -p "$MC" "$f"; echo; done
          curl -sSLo vf.jar https://github.com/Vineflower/vineflower/releases/download/1.11.1/vineflower-1.11.1.jar
          mkdir cls out
          cd cls && unzip -q "$MC" 'net/minecraft/world/level/block/NetherPortalBlock.class' 'net/minecraft/world/level/portal/*' 'net/minecraft/world/level/block/BaseFireBlock.class' 'net/minecraft/world/entity/Portal.class' 'net/minecraft/world/entity/Portal$*' 'net/minecraft/world/entity/PortalProcessor.class' 'net/minecraft/world/level/block/Portal*.class'; cd ..
          ls -R cls
          java -jar vf.jar -log=ERROR cls out >/dev/null 2>&1
          for f in $(find out -name '*.java' | sort); do echo "##### $f"; cat "$f"; done
          echo "##### javap misc"
          for c in net.minecraft.world.level.Level net.minecraft.server.level.ServerLevel net.minecraft.world.entity.Entity net.minecraft.world.entity.ai.village.poi.PoiTypes net.minecraft.world.level.block.Blocks net.minecraft.server.MinecraftServer net.minecraft.core.registries.Registries; do echo "##### javap $c"; javap -cp "$MC" "$c" | grep -iE 'portal|NETHER|OVERWORLD|getLevel\(|levelKeys|DIMENSION|teleport|CHISELED_DEEPSLATE|getPoiManager|dimension\(|POINT_OF_INTEREST|isInsidePortal|getWorldBorder|getMinY|getMaxY|registryAccess|BLOCK;|POI_TYPE' | head -60; done
          for m in fabric-object-builder-api-v1 fabric-dimensions-v1 fabric-registry-sync-v0 fabric-biome-api-v1 fabric-event-interaction-v0 fabric-events-interaction-v0 fabric-lifecycle-events-v1; do J=$(find ~/.gradle -name "$m*.jar" | grep -v sources | head -1); echo "##### $m $J"; [ -n "$J" ] && unzip -l "$J" | grep -E 'api/.*\.class' | awk '{print $4}' | head -30; done
          J=$(find ~/.gradle -name 'fabric-object-builder-api-v1*.jar' | grep -v sources | head -1); javap -cp "$J:$MC" net.fabricmc.fabric.api.object.builder.v1.world.poi.PointOfInterestHelper 2>&1 | head
