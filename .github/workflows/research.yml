name: Research
on:
  push:
    branches: [claude/project-thread-h6kkmi]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava -q
      - shell: bash {0}
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          unzip -l "$MC" | awk '{print $4}' > files.txt
          j() { for f in "$@"; do echo "##### $f"; unzip -p "$MC" "data/minecraft/$f" | jq -c .; done; }
          j worldgen/biome/lush_caves.json worldgen/density_function/overworld/temperature.json worldgen/density_function/overworld/vegetation.json
          for n in $(unzip -p "$MC" data/minecraft/worldgen/biome/lush_caves.json | jq -r '.features[][]' | sed 's/minecraft://') glowstone_extra glowstone large_dripstone dripstone_cluster pointed_dripstone; do j worldgen/placed_feature/$n.json; F=$(unzip -p "$MC" data/minecraft/worldgen/placed_feature/$n.json | jq -r '.feature | if type=="string" then . else empty end' | sed 's/minecraft://'); [ -n "$F" ] && j worldgen/feature/$F.json; done
          for n in cave_vine cave_vine_in_moss moss_vegetation moss_patch moss_patch_ceiling glowstone_extra amethyst_geode spore_blossom rooted_azalea_tree; do j worldgen/feature/$n.json; done
          echo "##### feature type names"; javap -cp "$MC" net.minecraft.world.level.levelgen.feature.Feature | grep 'public static final' | sed 's/.*Feature<.*> //' | tr '\n' ' '
          curl -sSLo vf.jar https://github.com/Vineflower/vineflower/releases/download/1.11.1/vineflower-1.11.1.jar
          mkdir cls out
          cd cls && unzip -q "$MC" 'net/minecraft/world/level/levelgen/feature/GlowstoneFeature.class' 'net/minecraft/world/level/biome/Climate$ParameterPoint.class' 'net/minecraft/world/level/biome/Climate$Parameter.class' 'net/minecraft/world/level/biome/MultiNoiseBiomeSource.class' 'net/minecraft/world/level/levelgen/feature/FeaturePlaceContext.class'; cd ..
          java -jar vf.jar -log=ERROR cls out >/dev/null 2>&1
          for f in $(find out -name '*.java' | sort); do echo "##### $f"; grep -v '^import' "$f"; done
          javap -p -cp "$MC" net.minecraft.world.level.levelgen.feature.Feature | grep -E 'Feature\(|register|place\(|codec|configuredCodec' | head
          javap -cp "$MC" net.minecraft.core.registries.BuiltInRegistries | grep -E ' FEATURE;'
          grep -E 'worldgen/biome/' files.txt | tr '\n' ' '
