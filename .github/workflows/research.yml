name: Research
on:
  push:
    paths: ['.github/workflows/research.yml']
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: |
          url=$(curl -sSf "https://api.modrinth.com/v2/project/enchanting-infuser/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%2226.3%22%5D" | jq -r '.[0].files[] | select(.primary) | .url')
          curl -sSfL -o inf.jar "$url"
          unzip -q -o inf.jar -d inf
          H=fuzs.enchantinginfuser.common.util.EnchantmentCostHelper
          echo "=== EnchantmentCostHelper bytecode"
          javap -p -c -constants -cp inf $H
          echo "=== VanillaEnchantingBehavior"
          javap -p -c -constants -cp inf fuzs.enchantinginfuser.common.world.item.enchantment.VanillaEnchantingBehavior | grep -nE "getMaximumCostMultiplier|ldc|fconst|iconst|bipush|sipush|public" | head -80
          echo "=== CostsConfig"
          javap -p -c -constants -cp inf 'fuzs.enchantinginfuser.common.config.ServerConfig$CostsConfig' | grep -nE "maximumCost|scaleCosts|ldc|bipush|sipush|iconst|fconst|putfield|public|final|int |boolean " | head -60
