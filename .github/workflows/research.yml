name: Research
on:
  push:
    branches: [claude/project-thread-k77z8b]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava -q
      - shell: bash {0}
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          echo "MC=$MC"
          curl -sSLo vf.jar https://github.com/Vineflower/vineflower/releases/download/1.11.1/vineflower-1.11.1.jar
          mkdir cls out
          cd cls && unzip -q "$MC" 'net/minecraft/world/entity/LivingEntity.class' 'net/minecraft/server/level/ServerPlayer.class' 'net/minecraft/world/entity/player/Player.class' 'net/minecraft/world/entity/player/Inventory.class' 'net/minecraft/world/entity/ExperienceOrb.class' 'net/minecraft/world/level/block/JukeboxBlock.class' 'net/minecraft/world/level/block/entity/JukeboxBlockEntity.class' 'net/minecraft/world/level/block/Blocks.class' 'net/minecraft/world/level/block/entity/BlockEntityType.class' 'net/minecraft/world/level/block/LecternBlock.class'; cd ..
          java -jar vf.jar -log=ERROR cls out >/dev/null 2>&1
          m() { echo "##### $1 :: $2"; awk "/$2/,/^   }\$/" "out/$1.java" | head -${3:-80}; }
          m net/minecraft/world/entity/LivingEntity 'public void die\(' 60
          m net/minecraft/world/entity/LivingEntity 'void dropAllDeathLoot\(' 40
          m net/minecraft/world/entity/LivingEntity 'void dropExperience\(' 30
          m net/minecraft/server/level/ServerPlayer 'public void die\(' 70
          m net/minecraft/server/level/ServerPlayer 'ItemEntity drop\(' 40
          m net/minecraft/world/entity/player/Player 'ItemEntity drop\(' 40
          m net/minecraft/world/entity/player/Player 'void dropEquipment\(' 30
          m net/minecraft/world/entity/player/Player 'getBaseExperienceReward\(' 20
          m net/minecraft/world/entity/player/Inventory 'public void dropAll\(' 30
          m net/minecraft/world/entity/player/Inventory 'public ItemStack getItem\(' 20
          m net/minecraft/world/entity/player/Inventory 'public void setItem\(' 20
          m net/minecraft/world/entity/ExperienceOrb 'public static void award\(' 30
          echo "##### Inventory head"; sed -n 1,80p out/net/minecraft/world/entity/player/Inventory.java
          echo "##### Jukebox block"; cat out/net/minecraft/world/level/block/JukeboxBlock.java
          echo "##### Jukebox BE"; sed -n 1,200p out/net/minecraft/world/level/block/entity/JukeboxBlockEntity.java
          echo "##### Lectern block"; grep -n 'protected\|public' out/net/minecraft/world/level/block/LecternBlock.java
          echo "##### BlockEntityType"; grep -n 'public\|JUKEBOX\|private static' out/net/minecraft/world/level/block/entity/BlockEntityType.java | head -40
          echo "##### Blocks"; grep -n 'private static\|public static Block register\|JUKEBOX =\|LECTERN =' out/net/minecraft/world/level/block/Blocks.java | head -30; grep -n -A6 'JUKEBOX = ' out/net/minecraft/world/level/block/Blocks.java
          for c in net.minecraft.server.level.ServerLevel net.minecraft.world.level.block.state.BlockBehaviour net.minecraft.world.level.block.Block net.minecraft.world.level.block.BaseEntityBlock 'net.minecraft.world.level.block.state.BlockBehaviour$Properties' net.minecraft.world.level.storage.ValueOutput net.minecraft.world.level.storage.ValueInput net.minecraft.world.level.block.entity.BlockEntity net.minecraft.world.entity.ExperienceOrb net.minecraft.world.entity.player.Inventory net.minecraft.world.level.Level net.minecraft.world.entity.item.ItemEntity net.minecraft.core.UUIDUtil net.minecraft.world.level.block.state.BlockBehaviour\$BlockStateBase; do echo "##### javap $c"; javap -p -cp "$MC" "$c" | grep -v 'lambda\$' | head -400; done
          FAPI=$(find ~/.gradle -name 'fabric-entity-events-v1*.jar' | grep -v sources | head -1); echo "FAPI=$FAPI"
          mkdir fcls fout; cd fcls; unzip -q "$FAPI"; cd ..
          find fcls -name '*.class' | grep -i mixin
          java -jar vf.jar -log=ERROR fcls/net/fabricmc/fabric/mixin fout >/dev/null 2>&1
          grep -rn -B8 'AFTER_DEATH' fout | head -80
          find ~/.gradle -name 'fabric-*block*entity*.jar' -o -name 'fabric-object-builder*.jar' | head
          OB=$(find ~/.gradle -name 'fabric-object-builder-api-v1*.jar' | grep -v sources | head -1); unzip -l "$OB" | grep -i 'BlockEntityType' 
          javap -p -cp "$OB" net.fabricmc.fabric.api.object.builder.v1.block.entity.FabricBlockEntityTypeBuilder 2>&1 | head -20
          javap -p -cp "$MC" 'net.minecraft.world.level.block.entity.BlockEntityType$BlockEntitySupplier' | head
          echo "##### modrinth xaero"; curl -sS "https://api.modrinth.com/v2/project/xaeros-minimap/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%2226.3%22%5D" | jq -r '.[] | .version_number + "  " + .id + "  " + (.files[0].filename)' | head
