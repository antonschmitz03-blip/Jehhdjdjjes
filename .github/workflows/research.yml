name: Research
on:
  push:
    branches: [claude/project-thread-h6kkmi]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava -q
      - shell: bash {0}
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          unzip -l "$MC" | awk '{print $4}' > files.txt
          echo "##### class paths"; grep -E '/(Cow|AbstractCow|Animal|CowRenderer|CowModel|QuadrupedModel|MobRenderer|AgeableMobRenderer|LivingEntityRenderState|CowRenderState|SpawnPlacements|SpawnPlacementTypes|SpawnEggItem|TemptGoal|BreedGoal|PanicGoal|FollowParentGoal|WaterAvoidingRandomStrollGoal|LookAtPlayerGoal|RandomLookAroundGoal|FloatGoal|LayerDefinition|MeshDefinition|PartDefinition|CubeListBuilder|PartPose|ModelLayerLocation|EntityRendererProvider|SynchedEntityData|EntityDataSerializers|EntityDataAccessor|AgeableMob|Mob|PathfinderMob|LivingEntity|InteractionResult|ValueInput|ValueOutput)\.class$' files.txt
          echo "##### loot"; grep -E 'loot_table/entities/(cow|armadillo)\.json' files.txt; unzip -p "$MC" data/minecraft/loot_table/entities/armadillo.json | jq -c .
          echo "##### spawn egg assets"; grep -E 'assets/minecraft/(items|models/item|textures/item)/cow_spawn_egg' files.txt
          for f in assets/minecraft/items/cow_spawn_egg.json assets/minecraft/models/item/cow_spawn_egg.json; do echo "## $f"; unzip -p "$MC" $f; done
          P() { echo "##### javap $1"; javap -p -cp "$MC" "$1" | grep -vE 'lambda\$' | head -${2:-80}; }
          cls() { grep -E "/$1\.class$" files.txt | head -1 | sed 's#\.class$##; s#/#.#g'; }
          for c in Animal AgeableMob Mob PathfinderMob SpawnPlacements SpawnPlacementTypes SpawnEggItem TemptGoal BreedGoal PanicGoal FollowParentGoal WaterAvoidingRandomStrollGoal LookAtPlayerGoal RandomLookAroundGoal FloatGoal LayerDefinition MeshDefinition PartDefinition CubeListBuilder PartPose ModelLayerLocation SynchedEntityData EntityDataSerializers InteractionResult LivingEntityRenderState MobRenderer AgeableMobRenderer; do n=$(cls $c); [ -n "$n" ] && P "$n" 60; done
          P 'net.minecraft.world.entity.EntityType$Builder' 80
          P 'net.minecraft.client.renderer.entity.EntityRendererProvider$Context' 40
          P 'net.minecraft.world.item.Item$Properties' 120
          curl -sSLo vf.jar https://github.com/Vineflower/vineflower/releases/download/1.11.1/vineflower-1.11.1.jar
          mkdir cls out
          cd cls && unzip -q "$MC" $(grep -E '/(Cow|AbstractCow|CowRenderer|CowModel|QuadrupedModel|CowRenderState|AbstractCowRenderer)\.class$' ../files.txt | tr '\n' ' '); cd ..
          java -jar vf.jar -log=ERROR cls out >/dev/null 2>&1
          for f in $(find out -name '*.java' | sort); do echo "##### $f"; grep -v '^import' "$f"; done
          echo "##### fabric api classes"
          for j in $(find ~/.gradle -name 'fabric-*.jar' | grep -vE 'sources|loom|loader|mapping' ); do unzip -l "$j" 2>/dev/null | awk '{print $4}' | grep -E '(EntityRendererRegistry|EntityModelLayerRegistry|FabricDefaultAttributeRegistry|SpawnRestriction|FabricEntityType|BiomeModifications|SpawnPlacement)[A-Za-z$]*\.class$' | sed "s#^#$j :: #"; done | sort -u | head -40
          for j in $(find ~/.gradle -name 'fabric-*.jar' | grep -vE 'sources|loom|loader|mapping'); do for c in $(unzip -l "$j" 2>/dev/null | awk '{print $4}' | grep -E '/(EntityRendererRegistry|EntityModelLayerRegistry|FabricDefaultAttributeRegistry|FabricEntityType|FabricEntityType\$Builder|FabricEntityType\$Builder\$Mob)\.class$'); do echo "## $c"; javap -cp "$j" "$(echo $c | sed 's#\.class$##; s#/#.#g')" | head -40; done; done
