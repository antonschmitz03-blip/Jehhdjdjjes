name: Research (temporary)
on:
  push:
    paths: ['.github/workflows/research.yml']
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava -q
      - run: |
          MC=$(find ~/.gradle .gradle -name 'minecraft-merged*.jar' -o -name 'minecraft-common*.jar' 2>/dev/null | grep -v sources | head -1)
          echo "MC jar: $MC"; find ~/.gradle .gradle -name '*.jar' -path '*minecraft*' 2>/dev/null | grep -v sources | head -20
          curl -sSLo vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
          mkdir cls out
          cd cls && unzip -q "$MC" 'net/minecraft/world/item/component/ItemContainerContents*' 'net/minecraft/world/item/ItemStack.class' 'net/minecraft/world/item/ItemStackTemplate*' 'net/minecraft/world/inventory/Slot.class' 'net/minecraft/world/inventory/AbstractContainerMenu.class' 'net/minecraft/world/ItemStackWithSlot*' 'net/minecraft/util/ExtraCodecs.class' 'net/minecraft/world/inventory/ContainerInput*' || true; cd ..
          java -jar vf.jar -log=ERROR cls out
          for f in $(find out -name '*.java'); do echo "=================== $f"; cat "$f"; done > dump.txt
          for c in net/minecraft/world/item/ItemStack net/minecraft/world/item/ItemStackTemplate; do echo "######## javap $c"; javap -c -p -cp "$MC" $c | grep -n "lambda\|intRange\|bipush\s*99\|Method .*ExtraCodecs" | head -60; done
          echo "######## doClick"; awk '/void doClick\(/,/^   }$/' out/net/minecraft/world/inventory/AbstractContainerMenu.java
          echo "######## clicked"; grep -n "public void clicked" -A25 out/net/minecraft/world/inventory/AbstractContainerMenu.java
      - uses: actions/upload-artifact@v4
        with: { name: dump, path: dump.txt }
