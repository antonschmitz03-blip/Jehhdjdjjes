name: Research (temporary)
on:
  push:
    paths: ['.github/workflows/research.yml']
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava -q
      - run: |
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          curl -sSLo vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
          mkdir cls out
          cd cls && unzip -q "$MC" 'net/minecraft/world/inventory/EnchantmentMenu*' 'net/minecraft/client/gui/screens/inventory/EnchantmentScreen*' 'net/minecraft/world/inventory/AnvilMenu.class' 'net/minecraft/client/gui/screens/inventory/AnvilScreen.class' 'net/minecraft/world/level/block/FarmBlock.class' 'net/minecraft/world/level/block/DoorBlock.class' 'net/minecraft/world/item/Items.class'; cd ..
          java -jar vf.jar -log=ERROR cls out >/dev/null 2>&1
          echo "##### EnchantmentMenu clickMenuButton"; awk '/public boolean clickMenuButton/,/^   }$/' out/net/minecraft/world/inventory/EnchantmentMenu.java
          echo "##### EnchantmentMenu costs decl"; grep -n "costs" out/net/minecraft/world/inventory/EnchantmentMenu.java | head -20
          echo "##### EnchantmentScreen costs usages"; grep -n "costs\|experienceLevel\|class EnchantmentScreen\|public void render\|protected void extract\|void .*(" out/net/minecraft/client/gui/screens/inventory/EnchantmentScreen.java | head -60
          echo "##### EnchantmentScreen full"; cat out/net/minecraft/client/gui/screens/inventory/EnchantmentScreen.java | sed -n 1,400p
          echo "##### Anvil"; grep -n "40\|cost\b\|TOO_EXPENSIVE\|too_expensive\|void createResult" out/net/minecraft/world/inventory/AnvilMenu.java | head -30; grep -n "40\|too_expensive\|TOO_EXPENSIVE\|cost" out/net/minecraft/client/gui/screens/inventory/AnvilScreen.java | head
          javap -c -p -cp "$MC" net.minecraft.world.inventory.AnvilMenu | grep -n "bipush        40\|createResult" | head
          javap -c -p -cp "$MC" net.minecraft.client.gui.screens.inventory.AnvilScreen | grep -n "bipush        40\|void " | head
          echo "##### Farm"; grep -n "fallOn\|turnToDirt\|public \|protected " out/net/minecraft/world/level/block/FarmBlock.java | head -30; awk '/void fallOn/,/^   }$/' out/net/minecraft/world/level/block/FarmBlock.java
          echo "##### Door"; grep -n "public \|protected " out/net/minecraft/world/level/block/DoorBlock.java | head -50
          echo "##### Items chain/saddle"; grep -n "CHAIN\|SADDLE\|NAME_TAG\|HORSE_ARMOR\|CHAINMAIL" out/net/minecraft/world/item/Items.java | head -30
