name: Research
on:
  push:
    paths: ['.github/workflows/research.yml']
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: chmod +x gradlew && ./gradlew :vanilla-tweaks:compileJava --no-daemon -q || true
      - run: |
          J=~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged-deobf/26.3/minecraft-merged-deobf-26.3.jar
          echo "=== LocalPlayer.aiStep fall flying"
          javap -p -c -cp $J net.minecraft.client.player.LocalPlayer | awk '/void aiStep\(\)/,/^$/' | grep -nE "invoke|getstatic|ldc|ifeq|ifne|if_|goto" | grep -iE "fall|jump|keyPresses|Input|START|Command|tryTo|onGround|isFree" | head -40
          echo "=== tryToStartFallFlying anywhere"
          javap -p -cp $J net.minecraft.world.entity.player.Player | grep -iE "fallflying|FallFlying"
          javap -p -cp $J net.minecraft.client.player.LocalPlayer | grep -iE "fallflying|FallFlying|jump"
          echo "=== ClientInput / Input"
          javap -p -cp $J net.minecraft.world.entity.player.Input | head -30
          echo "=== KeyMapping"
          javap -p -cp $J net.minecraft.client.KeyMapping | grep -E "KeyMapping\(|Category|public"
          javap -p -cp $J 'net.minecraft.client.KeyMapping$Category' | head -20
          echo "=== fabric key binding api"
          find ~/.gradle -name 'fabric-key-binding-api*' | head -3
          for j in $(find ~/.gradle -name 'fabric-key-binding-api*.jar' | grep -v sources | head -1); do unzip -l $j | grep -i class | head -20; done
