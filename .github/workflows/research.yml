name: Research
on:
  push:
    branches: [claude/project-thread-h6kkmi]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :mining-dimension:compileJava -q || true
      - shell: bash {0}
        run: |
          pip install -q pillow
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          mkdir t && cd t && unzip -q "$MC" 'assets/minecraft/textures/block/*_ore.png' assets/minecraft/textures/block/stone.png assets/minecraft/textures/block/deepslate.png && cd ..
          python3 - <<'PY'
          import glob,collections
          from PIL import Image
          px=lambda p:[c[:3] for c in Image.open(p).convert('RGBA').getdata()]
          base=set(px('t/assets/minecraft/textures/block/stone.png'))|set(px('t/assets/minecraft/textures/block/deepslate.png'))
          for f in sorted(glob.glob('t/assets/minecraft/textures/block/*_ore.png')):
              cnt=collections.Counter(c for c in px(f) if c not in base)
              print('ORE',f.split('/')[-1], [('#%02x%02x%02x'%c,n) for c,n in cnt.most_common(10)])
          PY
