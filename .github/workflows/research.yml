name: Research (temporary)
on:
  push:
    paths: ['.github/workflows/research.yml']
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava -q
      - shell: bash {0}
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          curl -sSLo vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
          mkdir cls out
          cd cls && unzip -q "$MC" 'net/minecraft/world/inventory/ChestMenu*' 'net/minecraft/world/inventory/ShulkerBoxMenu*' 'net/minecraft/world/inventory/Slot.class' 'net/minecraft/client/gui/screens/inventory/ContainerScreen*' 'net/minecraft/client/gui/screens/inventory/ShulkerBoxScreen*' 'net/minecraft/client/gui/screens/inventory/AbstractContainerScreen*' 'net/minecraft/client/gui/GuiGraphicsExtractor.class' 'net/minecraft/world/inventory/AbstractContainerMenu.class'; cd ..
          java -jar vf.jar -log=ERROR cls out >/dev/null 2>&1
          for f in world/inventory/ChestMenu world/inventory/ShulkerBoxMenu client/gui/screens/inventory/ContainerScreen client/gui/screens/inventory/ShulkerBoxScreen; do echo "##### $f"; cat out/net/minecraft/$f.java; done
          echo "##### AbstractContainerScreen"; sed -n 1,400p out/net/minecraft/client/gui/screens/inventory/AbstractContainerScreen.java
          echo "##### AbstractContainerScreen 400+"; sed -n 400,900p out/net/minecraft/client/gui/screens/inventory/AbstractContainerScreen.java
          echo "##### Slot sigs"; grep -n "public \|protected " out/net/minecraft/world/inventory/Slot.java
          echo "##### GuiGraphicsExtractor sigs"; grep -n "public .*(" out/net/minecraft/client/gui/GuiGraphicsExtractor.java | head -120
          echo "##### AbstractContainerMenu sigs"; grep -n "public .*(\|protected .*(" out/net/minecraft/world/inventory/AbstractContainerMenu.java | head -80
