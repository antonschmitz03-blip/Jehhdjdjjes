name: Research
on:
  push:
    branches: [claude/project-thread-h6kkmi]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :mining-dimension:compileJava -q || true
      - shell: bash {0}
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          unzip -l "$MC" | awk '{print $4}' > files.txt
          grep -E 'levelgen/feature/[A-Za-z]*\.class$' files.txt | head -80
          grep -iE 'SimpleBlock|NoneFeatureConfig|FeaturePlaceContext|BlockBlobFeature|FeatureType' files.txt | head -30
          javap -cp "$MC" net.minecraft.core.registries.BuiltInRegistries | grep -i feature
          curl -sSLo vf.jar https://github.com/Vineflower/vineflower/releases/download/1.11.1/vineflower-1.11.1.jar
          mkdir cls out; cd cls && unzip -q "$MC" $(grep -E '/(Feature|SimpleBlockFeature|BlockBlobFeature|NoneFeatureConfiguration|FeaturePlaceContext|FeatureType)\.class$' ../files.txt | tr '\n' ' '); cd ..
          java -jar vf.jar -log=ERROR cls out >/dev/null 2>&1
          for f in $(find out -name '*.java' | sort); do echo "##### $f"; grep -v '^import' "$f" | head -150; done
