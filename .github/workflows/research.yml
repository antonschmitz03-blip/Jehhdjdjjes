name: Research
on:
  push:
    paths: ['.github/workflows/research.yml']
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: |
          for project in forge-config-api-port puzzles-lib enchanting-infuser; do
            url=$(curl -sSf "https://api.modrinth.com/v2/project/$project/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%2226.3%22%5D" | jq -r '.[0].files[] | select(.primary) | .url')
            curl -sSfL -o "$project.jar" "$url"
          done
          unzip -q -o enchanting-infuser.jar -d inf
          C=fuzs.enchantinginfuser.common.world.inventory.InfuserMenu
          echo "=== calculateEnchantingCost"
          javap -p -c -cp inf $C | awk '/private int calculateEnchantingCost\(\)/{f=1} f{print} /private boolean clickRepairButton/{f=0}'
          echo "=== processEnchantingCost"
          javap -p -c -cp inf $C | awk '/private void processEnchantingCost/{f=1} f{print} /private int calculateEnchantingCost/{f=0}'
          echo "=== Screen cost uses"
          javap -p -c -cp inf 'fuzs.enchantinginfuser.common.client.gui.screens.inventory.InfuserScreen' | grep -nE "Cost|cost|experienceLevel|getEnchantingCost|calculate" | head -60
          javap -p -c -cp inf 'fuzs.enchantinginfuser.common.client.gui.components.InfuserEnchantButton' | grep -nE "Cost|cost|experienceLevel" | head -40
          echo "=== EnchantmentCostHelper"
          javap -p -cp inf fuzs.enchantinginfuser.common.util.EnchantmentCostHelper
