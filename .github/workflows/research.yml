name: Research
on:
  push:
    branches: [claude/project-thread-su7uqz]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava -q
      - shell: bash {0}
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          [ -z "$MC" ] && MC=$(find ~/.gradle -name 'minecraft-client*.jar' | head -1)
          echo "jar: $MC"; find ~/.gradle -name 'minecraft-*.jar' | head
          SCR=$(find ~/.gradle -name 'fabric-screen-api-v1*.jar' | grep -v sources | head -1)
          LIFE=$(find ~/.gradle -name 'fabric-lifecycle-events-v1*.jar' | grep -v sources | head -1)
          CP="$MC:$SCR:$LIFE"
          p() { echo "##### $1"; javap -p -cp "$CP" "$1" | grep -vE '^\s*$' | head -${2:-200}; }
          cd /tmp && unzip -q -o "$MC" 'net/minecraft/server/*' 'net/minecraft/world/entity/Entity.class' 'net/minecraft/world/entity/LivingEntity.class' 'net/minecraft/world/entity/player/Player.class' -d mcx && cd -
          echo "##### callers of loadPlayerData / PlayerDataStorage.load / ServerPlayer.load"
          for f in $(grep -rlE 'loadPlayerData|PlayerDataStorage\.load|ServerPlayer\.load|readAdditionalSaveData|loadAndSpawn' /tmp/mcx --include=*.class); do c=$(echo ${f#/tmp/mcx/} | sed 's/\.class$//; s#/#.#g'); javap -c -p -cp /tmp/mcx "$c" 2>/dev/null | awk -v c="$c" '/^  [a-z].*\(.*\);$/{m=$0} /loadPlayerData|PlayerDataStorage.load|ServerPlayer.load:|Player.load:|Entity.load:/{print c " :: " m " :: " $0}'; done | cut -c1-400
          echo "##### Entity.load bytecode"
          javap -c -p -cp /tmp/mcx net.minecraft.world.entity.Entity | awk '/public void load\(/{f=1} f{print} f&&/^$/{exit}' | grep -E 'String|Method' | head -60
          echo "##### ServerPlayer bytecode around load/spawn"
          javap -c -p -cp "$CP" net.minecraft.server.level.ServerPlayer | awk '/^  [a-z].*\(.*\);$/{m=$0; show=(m ~ /readAdditional|loadAndSpawn|adjustSpawn|<init>|snapTo|load\(/)} show' | grep -E '^  [a-z]|String|Method' | cut -c1-220 | head -150
