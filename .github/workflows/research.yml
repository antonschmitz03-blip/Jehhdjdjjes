name: Research
on:
  push:
    branches: [claude/project-thread-h6kkmi]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava -q
      - shell: bash {0}
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          unzip -l "$MC" | awk '{print $4}' > files.txt
          for f in $(grep -E 'worldgen/(material_rule|material_condition)/.+\.json' files.txt | sort); do echo "##### $f"; unzip -p "$MC" "$f" | jq -c .; done
          for f in $(grep -E 'worldgen/feature/ore_.+\.json' files.txt | sort); do echo "##### $f"; unzip -p "$MC" "$f" | jq -c '{size, discard_chance_on_air_exposure, states: [.targets[].state]}'; done
          for f in $(grep -E 'worldgen/placed_feature/ore_.+\.json' files.txt | sort); do echo "##### $f"; unzip -p "$MC" "$f" | jq -c .; done
          for f in $(grep -E 'worldgen/carver/.+\.json' files.txt | sort); do echo "##### $f"; unzip -p "$MC" "$f" | jq -c .; done
          for f in $(grep -E 'worldgen/(placed_)?feature/(spring_lava|lake_lava_underground|amethyst_geode|monster_room|glow_lichen)\.json' files.txt | sort); do echo "##### $f"; unzip -p "$MC" "$f" | jq -c .; done
          echo "##### tags with ore_replaceables"; grep -E 'tags/block/.*replaceables' files.txt
          unzip -p "$MC" data/minecraft/tags/block/height_specific_ore_replaceables.json
          echo "##### biome deep_dark"; unzip -p "$MC" data/minecraft/worldgen/biome/deep_dark.json | jq -c .
          curl -sSLo vf.jar https://github.com/Vineflower/vineflower/releases/download/1.11.1/vineflower-1.11.1.jar
          mkdir cls out
          cd cls && unzip -q "$MC" 'net/minecraft/world/level/levelgen/NoiseBasedChunkGenerator.class' 'net/minecraft/world/level/levelgen/material/MaterialRules.class' 'net/minecraft/world/level/levelgen/material/MaterialSystem.class' 'net/minecraft/world/level/biome/Biome.class' 'net/minecraft/world/level/biome/BiomeGenerationSettings.class'; cd ..
          java -jar vf.jar -log=ERROR cls out >/dev/null 2>&1
          for f in $(find out -name '*.java' | sort); do echo "##### $f"; grep -v '^import' "$f"; done
          javap -cp "$MC" net.minecraft.core.registries.BuiltInRegistries | grep -E ' BLOCK;| POINT_OF_INTEREST_TYPE;'
          javap -cp "$MC" net.minecraft.world.level.block.Blocks | head -5
          javap -p -cp "$MC" net.minecraft.world.level.block.Blocks | grep -E 'static .* register' | head
