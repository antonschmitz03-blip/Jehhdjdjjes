name: Research
on:
  push:
    branches: [claude/project-thread-k77z8b]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava -q
      - shell: bash {0}
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          NET=$(find ~/.gradle -name 'fabric-networking-api-v1*.jar' | grep -v sources | head -1); echo "NET=$NET"
          for c in net.fabricmc.fabric.api.networking.v1.PayloadTypeRegistry net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking 'net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking$PlayPayloadHandler' 'net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking$Context'; do echo "##### javap $c"; javap -cp "$NET:$MC" "$c" 2>&1 | head -40; done
          unzip -l "$NET" | grep -i 'api/' | head -40
          for c in net.minecraft.network.protocol.common.custom.CustomPacketPayload 'net.minecraft.network.protocol.common.custom.CustomPacketPayload$Type' net.minecraft.world.level.LevelHeightAccessor net.minecraft.world.item.ItemStack net.minecraft.world.InteractionResult net.minecraft.network.chat.Component; do echo "##### javap $c"; javap -cp "$MC" "$c" 2>&1 | grep -E 'Type|getMinY|getMaxY|getHeight|matches|isSameItem|CODEC|copy\(|SUCCESS|CONSUME|translatable|literal|isEmpty|interface|class' | head -40; done
          echo "##### Player/ServerPlayer/Entity methods"; for c in net.minecraft.world.entity.player.Player net.minecraft.server.level.ServerPlayer net.minecraft.world.entity.Entity net.minecraft.world.entity.LivingEntity; do javap -cp "$MC" "$c" | grep -E 'giveExperience|sendSystemMessage|displayClientMessage|permission|Permission|hasPermissions|getInventory|isCreative|getGameProfile|getName\(|getPlainTextName|getUUID|level\(\)|blockPosition|getDirection|getExperienceReward|isSpectator|getStringUUID|createItemStackToDrop|position\(' ; done
          echo "##### BlockStateProperties/HorizontalDirectionalBlock"; javap -cp "$MC" net.minecraft.world.level.block.HorizontalDirectionalBlock | head -20
          javap -cp "$MC" net.minecraft.world.level.levelgen.Heightmap\$Types | head -12
          javap -cp "$MC" net.minecraft.world.level.block.state.StateDefinition\$Builder | head
          javap -cp "$MC" net.minecraft.world.level.block.state.StateHolder | grep -E 'setValue|getValue'
          javap -cp "$MC" net.minecraft.util.Prediction | head
          javap -cp "$MC" net.minecraft.world.level.material.FluidState | grep -E 'is\(|isEmpty|getType'
          javap -cp "$MC" net.minecraft.tags.FluidTags | head
          echo "##### client"; javap -cp "$MC" net.minecraft.client.Minecraft | grep -E ' player;| level;|getInstance|execute\('
          echo "##### ServerPlayer die decompile ok"
          echo "##### wither immune tag"; unzip -l "$MC" | grep -E 'tags/block/(wither_immune|dragon_immune)'
          unzip -l "$MC" | grep -E 'assets/minecraft/(blockstates|items)/lectern' 
          unzip -p "$MC" assets/minecraft/blockstates/lectern.json; unzip -p "$MC" assets/minecraft/items/lectern.json
