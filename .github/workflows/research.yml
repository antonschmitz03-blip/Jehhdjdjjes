name: Research
on:
  push:
    branches: [claude/project-thread-h6kkmi]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava -q
      - shell: bash {0}
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          unzip -l "$MC" | awk '{print $4}' > files.txt
          j() { for f in "$@"; do echo "##### $f"; unzip -p "$MC" "data/minecraft/$f" | jq -c .; done; }
          echo "##### structure files"; grep -E 'data/minecraft/(worldgen/(structure|structure_set|template_pool)/(mineshaft|.*mineshaft)|tags/worldgen/biome/(has_structure/mineshaft|.*mineshaft))' files.txt
          for f in $(grep -E 'data/minecraft/worldgen/(structure|structure_set)/mineshaft' files.txt | sed 's#data/minecraft/##'); do j $f; done
          for f in $(grep -E 'data/minecraft/tags/worldgen/biome/has_structure/mineshaft' files.txt | sed 's#data/minecraft/##'); do j $f | cut -c1-600; done
          echo "##### basalt-ish features"; grep -E 'worldgen/(feature|placed_feature)/.*(basalt|blackstone|magma|delta|columns|netherrack)' files.txt | tr '\n' ' '
          echo; for f in worldgen/feature/ore_magma.json worldgen/feature/ore_blackstone.json worldgen/feature/basalt_pillar.json worldgen/feature/basalt_blobs.json worldgen/feature/blackstone_blobs.json worldgen/feature/delta.json worldgen/feature/small_basalt_columns.json worldgen/feature/large_basalt_columns.json worldgen/placed_feature/ore_magma.json worldgen/placed_feature/basalt_blobs.json worldgen/placed_feature/small_basalt_columns.json worldgen/placed_feature/large_basalt_columns.json worldgen/placed_feature/basalt_pillar.json; do unzip -p "$MC" "data/minecraft/$f" >/dev/null 2>&1 && j $f; done
          echo "##### mineshaft structure class"; javap -p -cp "$MC" net.minecraft.world.level.levelgen.structure.structures.MineshaftStructure | head -30
          echo "##### biome tag has_structure dir"; grep -c 'has_structure/' files.txt
          unzip -p "$MC" data/minecraft/worldgen/structure_set/mineshafts.json | jq -c . || true
