name: Research (temporary)
on:
  push:
    paths: ['.github/workflows/research.yml']
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew compileJava -q
      - shell: bash {0}
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          curl -sSLo vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
          mkdir cls out
          cd cls && unzip -q "$MC" 'net/minecraft/world/inventory/EnchantmentMenu*' 'net/minecraft/client/gui/screens/inventory/EnchantmentScreen*' 'net/minecraft/world/inventory/AnvilMenu.class' 'net/minecraft/client/gui/screens/inventory/AnvilScreen.class' 'net/minecraft/world/level/block/Farm*' 'net/minecraft/world/level/block/DoorBlock.class' 'net/minecraft/world/item/Items.class' || true; unzip -l "$MC" | grep -i 'farm\|trampl' | head; cd ..
          java -jar vf.jar -log=ERROR cls out >/dev/null 2>&1
          sed -n 80,120p out/net/minecraft/client/gui/screens/inventory/AnvilScreen.java
          grep -n "canOpenByHand\|record BlockSetType" -r out || true
          unzip -p "$MC" net/minecraft/world/level/block/state/properties/BlockSetType.class > bst.class; javap -p bst.class | grep -i "hand\|record" | head
