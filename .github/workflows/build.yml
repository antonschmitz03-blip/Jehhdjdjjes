name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: travelers-backpack-addons
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-plus-tweaks
          path: vanilla-tweaks/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: backpack-storage-link
          path: storage-link/build/libs/*.jar

      # Boots a dedicated server with Traveler's Backpack + Trinkets + Tom's Simple Storage + all mods and force-loads all mixin targets.
      - name: Server smoke test
        run: |
          mkdir -p run/mods
          cp libs/*.jar run/mods/
          cp vanilla-tweaks/build/libs/vanilla-plus-tweaks-*.jar run/mods/
          cp $(ls storage-link/build/libs/backpack-storage-link-*.jar | grep -v sources) run/mods/
          for project in forge-config-api-port puzzles-lib enchanting-infuser; do
            url=$(curl -sSf "https://api.modrinth.com/v2/project/$project/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%2226.3%22%5D" \
              | jq -r '.[0].files[] | select(.primary) | .url')
            echo "$project: $url"
            curl -sSfL -o "run/mods/$project.jar" "$url"
          done
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > run/server.properties
          mkfifo stdin.pipe
          (./gradlew runServer --console=plain < stdin.pipe > server.log 2>&1; echo "exit $?" >> server.log) &
          exec 3>stdin.pipe
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log || grep -q '^exit ' server.log; then break; fi
            sleep 5
          done
          echo stop >&3
          sleep 20
          exec 3>&-
          grep -iE 'tbaddons|vplustweaks|backpacklink|mixin|error|exception|Done \(' server.log | head -100
          grep -A30 'backpacklink self test FAILED' server.log || true
          grep -q 'tbaddons self test passed' server.log
          grep -q 'tbaddons self test: trinkets mixin loaded' server.log
          grep -q 'vplustweaks self test passed' server.log
          grep -q 'backpacklink self test: terminal mixin loaded' server.log
          grep -q 'backpacklink self test: pull from network then backpack ok' server.log
          grep -q 'backpacklink self test passed' server.log
          grep -q 'vplustweaks self test: enchanting infuser mixin loaded' server.log
          if grep -iE 'tbaddons:|vplustweaks:|backpacklink:' server.log | grep -iqE 'error|parsing|couldn.t'; then echo "tbaddons data failed to load"; exit 1; fi
