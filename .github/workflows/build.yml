name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: travelers-backpack-addons
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-plus-tweaks
          path: vanilla-tweaks/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: simple-graves
          path: graves/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: simple-waystones
          path: waystones/build/libs/*.jar

      # Boots a dedicated server with Traveler's Backpack + Trinkets + all four mods, force-loads all mixin targets
      # and lets Simple Graves kill a fake player to check the grave round trip.
      - name: Server smoke test
        run: |
          trap 'echo "--- server.log problems"; grep -nE "ERROR|Exception|Caused by|FAILED|Crash|crash|exit " server.log | grep -v server.properties | head -80 || true; grep -n -A14 "Incompatible mods" server.log | head -40 || true' EXIT
          mkdir -p run/mods
          cp libs/*.jar run/mods/
          cp vanilla-tweaks/build/libs/vanilla-plus-tweaks-*.jar run/mods/
          cp $(ls graves/build/libs/simple-graves-*.jar | grep -v sources) run/mods/
          cp $(ls waystones/build/libs/simple-waystones-*.jar | grep -v sources) run/mods/
          for project in forge-config-api-port puzzles-lib enchanting-infuser; do
            versions=$(curl -sSf "https://api.modrinth.com/v2/project/$project/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%2226.3%22%5D")
            echo "$project: $(echo "$versions" | jq -r '[.[].version_number] | join(", ")')"
            # Puzzles Lib's newest build needs a newer Fabric API than the one this project builds against.
            index=0
            if [ "$project" = puzzles-lib ]; then index=1; fi
            url=$(echo "$versions" | jq -r ".[$index].files[] | select(.primary) | .url")
            echo "using $url"
            curl -sSfL -o "run/mods/$project.jar" "$url"
          done
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > run/server.properties
          mkfifo stdin.pipe
          (./gradlew runServer --console=plain < stdin.pipe > server.log 2>&1; echo "exit $?" >> server.log) &
          exec 3>stdin.pipe
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log || grep -q '^exit ' server.log || grep -q 'BUILD FAILED' server.log; then break; fi
            sleep 5
          done
          echo stop >&3
          sleep 20
          exec 3>&-
          grep -iE 'tbaddons|vplustweaks|simplegraves|simplewaystones|mixin|error|exception|Done \(' server.log | head -100
          grep -q 'tbaddons self test passed' server.log
          grep -q 'tbaddons self test: trinkets mixin loaded' server.log
          grep -q 'vplustweaks self test passed' server.log
          grep -q 'vplustweaks self test: enchanting infuser mixin loaded' server.log
          grep -q 'simplegraves self test: travelers backpack mixin loaded' server.log
          grep -q 'simplegraves self test: death grave ok' server.log
          grep -q 'simplegraves self test: chest screen ok' server.log
          grep -q 'simplegraves self test passed' server.log
          grep -q 'simplewaystones self test: teleport ok' server.log
          grep -q 'simplewaystones self test: warp scroll ok' server.log
          grep -q 'simplewaystones self test: drops ok' server.log
          grep -q 'simplewaystones self test: rename ok' server.log
          grep -q 'simplewaystones self test passed' server.log
          if grep -iE 'tbaddons:|vplustweaks:|simplegraves:|simplewaystones:' server.log | grep -iqE 'error|parsing|couldn.t'; then echo "tbaddons data failed to load"; exit 1; fi
