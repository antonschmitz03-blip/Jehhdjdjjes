name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Vanilla Arsenal branch: builds only the arsenal subproject to keep CI short.
# Restore the full build (all mods, server smoke test) from the base branch before merging.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :arsenal:build --stacktrace
      - name: Mixin target check
        run: |
          cp=$(find ~/.gradle/caches/fabric-loom -name '*.jar' | tr '\n' ':')
          javap -cp "$cp" net.minecraft.world.entity.LivingEntity | grep causeFallDamage | tee sig.txt
          grep -q 'causeFallDamage(double, float, net.minecraft.world.damagesource.DamageSource)' sig.txt
          javap -cp "$cp" net.minecraft.world.entity.player.Player | grep tryToStartFallFlying
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-arsenal
          path: arsenal/build/libs/*.jar
