name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: travelers-backpack-addons
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-plus-tweaks
          path: vanilla-tweaks/build/libs/*.jar

      # Client mixins don't load on the test server; check their targets against the Minecraft jar instead.
      - name: Client mixin target check
        run: |
          MC=$(find ~/.gradle -name 'minecraft-merged.jar' | head -1)
          check() { if grep -qF -- "$2" "$1"; then echo "ok: $2"; else echo "MISSING in $1: $2"; grep -n "$3" "$1" | head -5; exit 1; fi; }
          for cls in ContainerScreen ShulkerBoxScreen; do
            javap -c -p -cp "$MC" net.minecraft.client.gui.screens.inventory.$cls > $cls.txt
            check $cls.txt 'extractBackground(net.minecraft.client.gui.GuiGraphicsExtractor, int, int, float)' extractBackground
            check $cls.txt 'GuiGraphicsExtractor.blit:(Lcom/mojang/renderpearl/api/pipeline/RenderPipeline;Lnet/minecraft/resources/Identifier;IIFFIIII)V' blit
          done
          for cls in AbstractFurnaceScreen HopperScreen DispenserScreen BrewingStandScreen; do
            javap -p -cp "$MC" net.minecraft.client.gui.screens.inventory.$cls > $cls.txt
            check $cls.txt 'void extractBackground(net.minecraft.client.gui.GuiGraphicsExtractor, int, int, float)' extractBackground
          done
          javap -p -cp "$MC" net.minecraft.client.gui.screens.inventory.AbstractContainerScreen > acs.txt
          check acs.txt 'boolean hasClickedOutside(double, double, int, int)' hasClickedOutside
          check acs.txt 'boolean mouseClicked(net.minecraft.client.input.MouseButtonEvent, boolean)' mouseClicked
          check acs.txt 'void extractLabels(net.minecraft.client.gui.GuiGraphicsExtractor, int, int)' extractLabels
          check acs.txt 'final int imageWidth;' imageWidth
          check acs.txt 'int leftPos;' leftPos
          check acs.txt 'int topPos;' topPos
          check acs.txt ' menu;' menu

      # Boots a dedicated server with Traveler's Backpack + Trinkets + Tom's Simple Storage + our mods and force-loads all mixin targets.
      - name: Server smoke test
        run: |
          mkdir -p run/mods
          cp libs/*.jar run/mods/
          cp vanilla-tweaks/build/libs/vanilla-plus-tweaks-*.jar run/mods/
          for project in forge-config-api-port puzzles-lib enchanting-infuser; do
            url=$(curl -sSf "https://api.modrinth.com/v2/project/$project/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%2226.3%22%5D" \
              | jq -r '.[0].files[] | select(.primary) | .url')
            echo "$project: $url"
            curl -sSfL -o "run/mods/$project.jar" "$url"
          done
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > run/server.properties
          mkfifo stdin.pipe
          (./gradlew runServer --console=plain < stdin.pipe > server.log 2>&1; echo "exit $?" >> server.log) &
          exec 3>stdin.pipe
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log || grep -q '^exit ' server.log; then break; fi
            sleep 5
          done
          echo stop >&3
          sleep 20
          exec 3>&-
          grep -iE 'tbaddons|vplustweaks|backpacklink|mixin|error|exception|Done \(' server.log | head -100
          grep -A30 'backpacklink self test FAILED' server.log || true
          grep -q 'tbaddons self test passed' server.log
          grep -q 'tbaddons self test: trinkets mixin loaded' server.log
          grep -q 'vplustweaks self test passed' server.log
          grep -q 'backpacklink self test: terminal mixin loaded' server.log
          grep -q 'backpacklink self test: pull from network then backpack ok' server.log
          grep -q 'backpacklink self test passed' server.log
          grep -q 'vplustweaks self test: enchanting infuser mixin loaded' server.log
          if grep -iE 'tbaddons:|vplustweaks:|backpacklink:' server.log | grep -iqE 'error|parsing|couldn.t'; then echo "tbaddons data failed to load"; exit 1; fi

      # The addon must also start without Tom's Simple Storage (an optional dependency).
      - name: Server smoke test without Tom's Simple Storage
        run: |
          # The first server can still hold the port while it shuts down.
          pkill -f 'runServer' || true
          sleep 5
          rm run/mods/toms_storage_*.jar
          rm -rf stdin.pipe server.log run/world
          sed -i 's/^server-port=.*//' run/server.properties
          echo 'server-port=25566' >> run/server.properties
          mkfifo stdin.pipe
          (./gradlew runServer --console=plain < stdin.pipe > server.log 2>&1; echo "exit $?" >> server.log) &
          exec 3>stdin.pipe
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log || grep -q '^exit ' server.log; then break; fi
            sleep 5
          done
          echo stop >&3 || true
          sleep 20
          exec 3>&-
          grep -iE 'tbaddons|backpacklink|error|exception|Done \(' server.log | head -60 || true
          tail -40 server.log
          grep -q 'Done (' server.log
          grep -q 'tbaddons self test passed' server.log
          if grep -q 'backpacklink self test' server.log; then echo "storage link loaded without Tom's"; exit 1; fi
