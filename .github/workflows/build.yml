name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: travelers-backpack-addons
          path: build/libs/*.jar

      # Boots a dedicated server with Traveler's Backpack + this addon and force-loads all mixin targets.
      - name: Server smoke test
        run: |
          mkdir -p run/mods
          cp libs/*.jar run/mods/
          url=$(curl -sSf 'https://api.modrinth.com/v2/project/forge-config-api-port/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%2226.3%22%5D' \
            | jq -r '.[0].files[] | select(.primary) | .url')
          echo "Forge Config API Port: $url"
          curl -sSfL -o run/mods/forgeconfigapiport.jar "$url"
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > run/server.properties
          mkfifo stdin.pipe
          (./gradlew runServer --console=plain < stdin.pipe > server.log 2>&1; echo "exit $?" >> server.log) &
          exec 3>stdin.pipe
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log || grep -q '^exit ' server.log; then break; fi
            sleep 5
          done
          echo stop >&3
          sleep 20
          exec 3>&-
          grep -iE 'tbaddons|mixin|error|exception|Done \(' server.log | head -100
          grep -q 'tbaddons self test passed' server.log
