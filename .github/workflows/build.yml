name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: travelers-backpack-addons
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-plus-tweaks
          path: vanilla-tweaks/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: happy-ghast-plus
          path: happy-ghast/build/libs/*.jar

      # Boots a dedicated server with Traveler's Backpack + Trinkets + this addon and force-loads all mixin targets.
      - name: Server smoke test
        run: |
          mkdir -p run/mods
          cp libs/*.jar run/mods/
          cp vanilla-tweaks/build/libs/vanilla-plus-tweaks-*.jar run/mods/
          cp happy-ghast/build/libs/happy-ghast-plus-*.jar run/mods/
          for project in forge-config-api-port puzzles-lib enchanting-infuser; do
            url=$(curl -sSf "https://api.modrinth.com/v2/project/$project/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%2226.3%22%5D" \
              | jq -r '.[0].files[] | select(.primary) | .url')
            echo "$project: $url"
            curl -sSfL -o "run/mods/$project.jar" "$url"
          done
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > run/server.properties
          mkfifo stdin.pipe
          (./gradlew runServer --console=plain < stdin.pipe > server.log 2>&1; echo "exit $?" >> server.log) &
          exec 3>stdin.pipe
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log || grep -q '^exit ' server.log; then break; fi
            sleep 5
          done
          echo stop >&3
          sleep 20
          exec 3>&-
          grep -iE 'tbaddons|vplustweaks|happyghastplus|mixin|error|exception|Done \(' server.log | head -100
          grep -q 'tbaddons self test passed' server.log
          grep -q 'tbaddons self test: trinkets mixin loaded' server.log
          grep -q 'vplustweaks self test passed' server.log
          grep -q 'vplustweaks self test: enchanting infuser mixin loaded' server.log
          grep -q 'happyghastplus self test passed' server.log
          if grep -iE 'tbaddons:|vplustweaks:|happyghastplus:' server.log | grep -iqE 'error|parsing|couldn.t'; then echo "tbaddons data failed to load"; exit 1; fi

      # Vanilla+ Tweaks and Happy Ghast+ are independent mods: each must also boot without the other.
      - name: Standalone smoke tests
        run: |
          boot() {
            project=$1
            mkdir -p "$project/run"
            echo "eula=true" > "$project/run/eula.txt"
            printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > "$project/run/server.properties"
            rm -f "stdin-$project.pipe"
            mkfifo "stdin-$project.pipe"
            (./gradlew ":$project:runServer" --console=plain < "stdin-$project.pipe" > "$project.log" 2>&1; echo "exit $?" >> "$project.log") &
            exec 3>"stdin-$project.pipe"
            for i in $(seq 1 120); do
              if grep -q 'Done (' "$project.log" || grep -q '^exit ' "$project.log"; then break; fi
              sleep 5
            done
            echo stop >&3 || true
            sleep 20
            exec 3>&-
            grep -iE 'vplustweaks|happyghastplus|mixin|error|exception|Done \(' "$project.log" | head -60 || true
            tail -30 "$project.log"
          }
          boot happy-ghast
          grep -q 'happyghastplus self test passed' happy-ghast.log
          if grep -q 'vplustweaks' happy-ghast.log; then echo "happy-ghast alone mentions vplustweaks"; exit 1; fi
          boot vanilla-tweaks
          grep -q 'vplustweaks self test passed' vanilla-tweaks.log
          if grep -q 'happyghastplus' vanilla-tweaks.log; then echo "vanilla-tweaks alone mentions happyghastplus"; exit 1; fi
