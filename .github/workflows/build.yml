name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      # This branch is New Game Plus's: build and boot only that mod, the other mods have their own branches.
      - run: chmod +x gradlew && ./gradlew :newgameplus:build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: new-game-plus
          path: newgameplus/build/libs/*.jar

      # Boots a dedicated server with only New Game Plus: it imports a fake player and a tamed wolf through a fake
      # source world folder.
      - name: Server smoke test
        run: |
          mkdir -p newgameplus/run
          echo "eula=true" > newgameplus/run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > newgameplus/run/server.properties
          mkfifo stdin.pipe
          (./gradlew :newgameplus:runServer --console=plain < stdin.pipe > server.log 2>&1; echo "exit $?" >> server.log) &
          exec 3>stdin.pipe
          for i in $(seq 1 60); do
            if grep -q 'Done (' server.log || grep -q '^exit ' server.log; then break; fi
            sleep 5
          done
          echo stop >&3 || true
          sleep 20
          exec 3>&-
          grep -iE 'newgameplus|mixin|error|exception|Done \(' server.log | head -100
          grep -q 'newgameplus self test: import ok' server.log
          grep -q 'newgameplus self test: mobs ok' server.log
          grep -q 'newgameplus self test passed' server.log
