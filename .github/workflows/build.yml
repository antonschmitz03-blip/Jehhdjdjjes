name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: travelers-backpack-addons
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-plus-tweaks
          path: vanilla-tweaks/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: mining-dimension
          path: mining-dimension/build/libs/*.jar

      # Boots a dedicated server with Traveler's Backpack + Trinkets + this addon and force-loads all mixin targets.
      - name: Server smoke test
        run: |
          mkdir -p run/mods
          cp libs/*.jar run/mods/
          cp mining-dimension/build/libs/mining-dimension-*.jar run/mods/
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > run/server.properties
          mkfifo stdin.pipe
          (./gradlew runServer --console=plain < stdin.pipe > server.log 2>&1; echo "exit $?" >> server.log) &
          exec 3>stdin.pipe
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log || grep -q '^exit ' server.log; then break; fi
            sleep 5
          done
          echo stop >&3
          sleep 20
          exec 3>&-
          grep -iE 'tbaddons|vplustweaks|miningdim|mixin|error|exception|Done \(' server.log | head -100
          grep -i 'miningdim' server.log | head -30
          grep -q 'miningdim self test passed' server.log
          if grep -iE 'tbaddons:|vplustweaks:|miningdim:' server.log | grep -iqE 'error|parsing|couldn.t'; then echo "tbaddons data failed to load"; exit 1; fi

      - name: Server log
        if: always()
        run: |
          grep -iE 'miningdim|exception|error|Done \(|Caused by|Encountered' server.log | head -80 || true
          echo ----- tail; tail -60 server.log || true
