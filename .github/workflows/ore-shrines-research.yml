name: Ore Shrines research

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ore-shrines-research.yml'

jobs:
  research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ore-shrines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Minecraft jar
        shell: bash
        run: |
          chmod +x gradlew
          mkdir -p src/main/java
          ./gradlew compileJava --console=plain > /dev/null 2>&1 || true
          find ~/.gradle -name 'minecraft-merged*.jar' | head
      - name: javap
        shell: bash
        run: |
          JAR=$(find ~/.gradle -name 'minecraft-merged*.jar' | head -1)
          FAPI=$(find ~/.gradle -name 'fabric-api-*.jar' | head -1)
          CP="$JAR"
          p() { echo "=== $1 | $2"; javap -p -cp "$CP" "$1" 2>&1 | grep -E "$2" | head -40; }
          p net.minecraft.world.level.NaturalSpawner 'static'
          p net.minecraft.world.level.levelgen.PhantomSpawner '.'
          p net.minecraft.world.level.block.entity.AbstractFurnaceBlockEntity 'static|cookingTimer|cookingTotalTime|litTime'
          p net.minecraft.world.entity.ExperienceOrb 'static'
          p net.minecraft.server.level.ServerLevel 'sendParticles'
          p net.minecraft.core.particles.DustParticleOptions 'public'
          p net.minecraft.world.level.block.state.BlockBehaviour 'AnalogOutput|useItemOn|useWithoutItem|getTicker|preRemove|affectNeighborsAfterRemoval|animateTick'
          p net.minecraft.world.level.block.BaseEntityBlock '.'
          p net.minecraft.world.level.block.EntityBlock '.'
          p net.minecraft.world.entity.AgeableMob 'Age|age'
          p 'net.minecraft.world.level.block.state.BlockBehaviour$BlockStateBase' 'randomTick|isRandomlyTicking'
          p net.minecraft.stats.Stats 'TIME_SINCE_REST'
          p net.minecraft.world.entity.player.Player 'resetStat|awardStat|giveExperiencePoints'
          p net.minecraft.world.Container '.'
          p net.minecraft.world.effect.MobEffects 'REGENERATION'
          p net.minecraft.world.level.chunk.LevelChunk 'getBlockEntities'
          p net.minecraft.world.level.Level 'getChunk|hasChunkAt|isLoaded|getGameTime|getEntitiesOfClass|playSound\('
          p net.minecraft.world.level.block.SugarCaneBlock 'class'
          p net.minecraft.world.level.block.CactusBlock 'class'
          p net.minecraft.world.level.block.NetherWartBlock 'class'
          p net.minecraft.world.level.block.BonemealableBlock 'interface'
          p net.minecraft.world.level.block.BambooStalkBlock 'class'
          p net.minecraft.world.item.Items 'GOLDEN_CARROT|PHANTOM_MEMBRANE|GOLDEN_APPLE|BLAZE_ROD |WHEAT |EXPERIENCE_BOTTLE|RAW_IRON|RAW_GOLD|IRON_INGOT|GOLD_INGOT|DIAMOND|IRON_BLOCK|GOLD_BLOCK|GRAY_STAINED_GLASS_PANE|BARRIER|COMPASS|SPYGLASS|BOOK '
          p net.minecraft.world.level.block.Blocks ' IRON_BLOCK| GOLD_BLOCK| DIAMOND_BLOCK'
          p net.minecraft.world.InteractionResult 'static|class|interface'
          p net.minecraft.server.level.ServerPlayer 'sendSystemMessage|resetStat|serverLevel|level\('
          p net.minecraft.world.entity.Entity ' level\(|position\(|blockPosition'
          p net.minecraft.world.inventory.ChestMenu 'public'
          p net.minecraft.world.inventory.ContainerInput '.'
          p net.minecraft.world.level.block.entity.BlockEntity 'public|protected'
          p net.minecraft.world.entity.Mob 'checkSpawnRules'
          p net.minecraft.world.entity.MobCategory 'MONSTER'
          p net.minecraft.world.item.ItemStack 'consume|shrink|is\(|getCount|isEmpty'
          p net.minecraft.world.level.block.Block 'popExperience|box\('
          p net.minecraft.core.particles.ParticleTypes 'END_ROD|ENCHANT|HAPPY_VILLAGER|FLAME|HEART|ENTITY_EFFECT|DUST |TRIAL_SPAWNER|GLOW'
          p net.minecraft.sounds.SoundEvents 'BEACON_ACTIVATE|BEACON_POWER_SELECT|EXPERIENCE_ORB_PICKUP|AMETHYST_BLOCK_CHIME|BEACON_AMBIENT'
          p net.minecraft.world.level.block.entity.BeaconBlockEntity 'static|updateBase'
          p net.minecraft.world.entity.animal.Animal 'InLove|inLove'
          p net.minecraft.util.ARGB 'static int color|opaque'
          echo "=== NaturalSpawner bytecode around Mob.checkSpawnRules"
          javap -p -c -cp "$CP" net.minecraft.world.level.NaturalSpawner | grep -nE 'checkSpawnRules|isValidPositionForMob|isValidSpawnPostitionForType|Method|static' | head -60
          echo "=== fabric api"
          unzip -l "$FAPI" | head -5
          find ~/.gradle -name 'fabric-*.jar' | grep -iE 'content-registries|object-builder|networking' | head
