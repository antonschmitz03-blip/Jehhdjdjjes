name: Probe (temporary)

on:
  push:
    paths: ['.github/workflows/probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :happy-ghast:compileJava --stacktrace -q
      - name: Goggles model probe
        run: |
          set +e
          for j in $(find ~/.gradle /home/runner/work -name '*.jar' -path '*loom*' 2>/dev/null | grep -v sources); do
            for e in $(unzip -l "$j" 2>/dev/null | awk '{print $4}' | grep -E 'HappyGhastHarnessModel|HappyGhastModel' | grep '\.class$'); do
              c=$(echo "${e%.class}" | tr / .)
              echo "==== $j $c"; javap -c -p -cp "$j" "$c" 2>&1 | head -400
            done
          done | head -1500
