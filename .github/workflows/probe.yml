name: Probe (temporary)

on:
  push:
    paths: ['.github/workflows/probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew :happy-ghast:compileJava --stacktrace -q
      - name: Mob AI probe
        run: |
          set +e
          for j in $(find ~/.gradle /home/runner/work -name '*.jar' -path '*loom*' 2>/dev/null | grep -v sources); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/world/entity/Mob.class'; then
              echo "==== $j"; javap -p -cp "$j" net.minecraft.world.entity.Mob | grep -i -E 'aistep|tick|lookcontrol' 
              javap -c -p -cp "$j" net.minecraft.world.entity.Mob | grep -A40 'void serverAiStep()' | head -60
              javap -p -cp "$j" net.minecraft.world.entity.animal.happyghast.HappyGhast | grep -i -E 'still|step|tick'
            fi
          done
