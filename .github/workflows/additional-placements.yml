name: Additional Placements

on:
  push:
    paths:
      - 'additional-placements/**'
      - '.github/workflows/additional-placements.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: additional-placements
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain > build.log 2>&1 || status=$?
          grep -E -A2 'error:|warning: \[' build.log | grep -vE '^\s+at ' | awk '!seen[$0]++' | head -120
          grep -E 'BUILD|What went wrong' -A3 build.log | head -20
          exit ${status:-0}
      - name: Dump Minecraft class signatures
        if: failure()
        shell: bash
        run: |
          JAR=~/.gradle/caches/fabric-loom/26.3/minecraft-merged.jar
          while IFS='|' read -r cls filt; do
            case "$cls" in \#*|"") continue;; esac
            echo "=== $cls"
            if [ -n "$filt" ]; then javap -p -cp "$JAR" "$cls" 2>&1 | grep -iE "$filt|class |interface |record " | head -60; else javap -p -cp "$JAR" "$cls" 2>&1 | head -60; fi
          done < ci/javap-targets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: additional-placements
          path: additional-placements/build/libs/additional-placements-*.jar
