name: Additional Placements

on:
  push:
    paths:
      - 'additional-placements/**'
      - '.github/workflows/additional-placements.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: additional-placements
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain > build.log 2>&1 || status=$?
          { grep -E -A2 'error:' build.log | grep -vE '^\s+at |^--$' | awk '!seen[$0]++' | head -90
            grep -E 'What went wrong' -A3 build.log | head -8; } > ../summary.txt || true
          exit ${status:-0}
      # Boots a dedicated server with only this mod (mixin targets changed across versions, so compile alone proves little).
      - name: Server smoke test
        shell: bash
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > run/server.properties
          mkfifo stdin.pipe
          (./gradlew runServer --console=plain < stdin.pipe > server.log 2>&1; echo "exit $?" >> server.log) &
          exec 3>stdin.pipe
          for i in $(seq 1 60); do
            if grep -q 'Done (' server.log || grep -q '^exit ' server.log; then break; fi
            sleep 5
          done
          echo stop >&3 || true
          sleep 20
          exec 3>&-
          { grep -iE 'additionalplacements|additional placements|mixin|error|exception|Done \(' server.log | head -70; tail -15 server.log; } > ../summary.txt || true
          grep -q 'Done (' server.log
          if grep -iE 'mixin.*(fail|error)|InvalidInjection|critical injection' server.log; then exit 1; fi
      - name: Dump Minecraft class signatures
        if: failure()
        shell: bash
        run: |
          JAR=~/.gradle/caches/fabric-loom/26.3/minecraft-merged.jar
          while IFS='|' read -r cls filt; do
            case "$cls" in \#*|"") continue;; esac
            echo "=== $cls"
            if [ -n "$filt" ]; then javap -p -cp "$JAR" "$cls" 2>&1 | grep -iE "$filt" | head -30; else javap -p -cp "$JAR" "$cls" 2>&1 | head -30; fi
          done < ci/javap-targets.txt >> ../summary.txt
      - name: Summary
        if: failure()
        shell: bash
        run: |
          echo "##### SUMMARY #####"
          sed -E 's/net\.minecraft\.//g; s#/home/runner/work/[^/]+/[^/]+/additional-placements/src/main/java/com/firemerald/additionalplacements/##' ../summary.txt | cut -c1-260
          echo "##### END SUMMARY #####"
      - uses: actions/upload-artifact@v4
        with:
          name: additional-placements
          path: additional-placements/build/libs/additional-placements-*.jar
